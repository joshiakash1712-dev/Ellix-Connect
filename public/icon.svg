<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="icon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="116" fill="#0f172a" />
  <rect x="4" y="4" width="504" height="504" rx="112" stroke="#1e293b" stroke-width="8" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.06" />

  <!-- 3-Tier Isometric Connected Layers -->
  <g filter="url(#icon-glow)">
    <!-- Top Layer (Solid diamond facet) -->
    <path d="M256 120L130 188L256 256L382 188L256 120Z" fill="url(#icon-top)" />
    
    <!-- Middle Layer (Tier outline) -->
    <path d="M130 256L256 324L382 256" stroke="url(#icon-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom Layer (Tier outline) -->
    <path d="M130 324L256 392L382 324" stroke="url(#icon-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Focal Light Dot -->
    <circle cx="256" cy="188" r="16" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
