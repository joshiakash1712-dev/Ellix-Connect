<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#091322" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#0D9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4A7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="fl-front-grad" x1="15%" y1="90%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#2DD4A7" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <linearGradient id="fl-shadow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="fl-highlight-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6FFFA" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="fl-orb-3d" cx="36%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="28%" stop-color="#5EEAD4" />
      <stop offset="65%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <radialGradient id="i-dot-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="40%" stop-color="#2DD4A7" />
      <stop offset="85%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#042F2E" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#emerald-glow)" />

  <!-- Subtle Structural Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Main Framed Surface Card -->
  <rect
    x="80"
    y="70"
    width="1040"
    height="490"
    rx="28"
    fill="#0F172A"
    fill-opacity="0.82"
    stroke="url(#card-border)"
    stroke-width="2"
  />

  <!-- Top Emerald Accent Bar -->
  <rect x="480" y="70" width="240" height="3" rx="1.5" fill="#2DD4A7" />

  <!-- Official Ellix Connect Logo (Centered) -->
  <g transform="translate(410, 125) scale(1.1)">
    <!-- Left Logo Symbol -->
    <g transform="translate(6, 4) scale(0.54)">
      <path
        d="M 52 92 C 32 86 24 64 36 46 C 46 30 72 24 96 34 C 114 42 122 62 116 80 C 110 94 92 108 72 114 C 54 120 38 116 28 106"
        stroke="url(#fl-shadow-grad)"
        stroke-width="17"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.75"
      />
      <path
        d="M 28 106 C 18 94 18 72 32 54 C 44 38 68 28 92 34 C 112 40 120 58 116 74 C 110 94 88 110 64 112 C 48 114 38 108 34 98 C 30 88 38 76 50 68 C 66 58 88 56 102 66"
        stroke="url(#fl-front-grad)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 32 54 C 44 38 68 28 92 34 C 112 40 120 58 116 74 C 110 94 88 110 64 112"
        stroke="url(#fl-highlight-grad)"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"
        opacity="0.9"
      />
      <path
        d="M 44 72 C 58 63 78 61 90 70"
        stroke="#5EEAD4"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"
        opacity="0.7"
      />
      <g transform="translate(68, 76)">
        <ellipse cx="0" cy="11" rx="10" ry="4" fill="#042F2E" opacity="0.4" />
        <circle cx="0" cy="0" r="13" fill="url(#fl-orb-3d)" />
        <circle cx="-4" cy="-4" r="3.2" fill="#FFFFFF" opacity="0.8" />
      </g>
    </g>

    <!-- Wordmark "ellix" -->
    <g transform="translate(100, 0)">
      <path
        d="M 23 48 C 23 38 31 31 42 31 C 53 31 60 38 60 49 C 60 50.5 59.8 51.5 59.5 52.5 L 31.8 52.5 C 32.5 58 36.5 61.5 42.5 61.5 C 47 61.5 50.5 59.5 52.5 57 L 58.5 60 C 55 64.5 49.5 67.5 42 67.5 C 30.5 67.5 23 59.5 23 48 Z M 51.2 46.5 C 50.8 41.5 47 37.5 41.8 37.5 C 36.8 37.5 33 41.2 32.2 46.5 L 51.2 46.5 Z"
        fill="#FFFFFF"
      />
      <path d="M 67 19 L 75.5 19 L 75.5 66.5 L 67 66.5 Z" fill="#FFFFFF" />
      <path d="M 83 19 L 91.5 19 L 91.5 66.5 L 83 66.5 Z" fill="#FFFFFF" />
      <path d="M 99 32 L 107.5 32 L 107.5 66.5 L 99 66.5 Z" fill="#FFFFFF" />
      <circle cx="103.25" cy="22" r="5.2" fill="url(#i-dot-grad)" />
      <circle cx="101.8" cy="20.5" r="1.5" fill="#FFFFFF" opacity="0.8" />
      <path d="M 115 32 L 124 32 L 143.5 66.5 L 134.5 66.5 Z" fill="#FFFFFF" />
      <path d="M 115 66.5 L 123.5 66.5 L 129.5 56 L 125 48 Z" fill="#FFFFFF" />
      <path d="M 129 49 L 134.5 40 L 144 32 L 135 32 L 127 44.5 Z" fill="#2DD4A7" />
      <text
        x="24"
        y="82"
        font-family="sans-serif"
        font-weight="700"
        font-size="11.5"
        letter-spacing="4.2"
        fill="#2DD4A7"
      >CONNECT</text>
    </g>
  </g>

  <!-- Primary Headline: Tagline -->
  <text
    x="600"
    y="318"
    text-anchor="middle"
    font-family="sans-serif"
    font-weight="800"
    font-size="48"
    fill="#FFFFFF"
  >Business management, without the complexity.</text>

  <!-- Supporting Line -->
  <text
    x="600"
    y="376"
    text-anchor="middle"
    font-family="sans-serif"
    font-weight="500"
    font-size="24"
    fill="#94A3B8"
  >One connected platform for local retailers and small businesses.</text>

  <!-- Divider Line -->
  <line x1="320" y1="428" x2="880" y2="428" stroke="#1E293B" stroke-width="1.5" />

  <!-- Core Capabilities Row -->
  <text
    x="600"
    y="476"
    text-anchor="middle"
    font-family="sans-serif"
    font-weight="700"
    font-size="20"
    letter-spacing="1.2"
    fill="#2DD4A7"
  >BILLING   ·   INVENTORY   ·   CUSTOMERS   ·   PAYMENTS   ·   TRANSACTIONS   ·   INSIGHTS</text>
</svg>
